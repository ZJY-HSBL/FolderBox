[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folderbox"
dynamic = ["version"]
description = "Lightweight persistent folder portals for the Windows desktop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "send2trash>=1.8"
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = [
  "pytest>=8.0",
  "ruff>=0.8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F", "B"]

[project.scripts]
folderbox = "folderbox.app:main"

[tool.setuptools.dynamic]
version = {attr = "folderbox.__version__"}

[tool.setuptools.packages.find]
include = ["folderbox*"]

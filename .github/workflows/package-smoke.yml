name: Packaging Smoke Test

on:
  push:
    branches:
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build,dev]"

      - name: Resolve package version
        shell: pwsh
        run: |
          $version = python -c "import folderbox; print(folderbox.__version__)"
          "FOLDERBOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Quality checks
        run: |
          python -m ruff check folderbox tests
          python -m pytest -q

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name FolderBox `
            --icon assets/app.ico `
            --add-data "assets;assets" `
            folderbox/__main__.py

      - name: Verify application bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FolderBox\FolderBox.exe")) {
            throw "FolderBox.exe was not generated."
          }
          Get-Item "dist\FolderBox\FolderBox.exe" | Format-List Name,Length,FullName

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build package artifacts
        shell: pwsh
        run: |
          $version = "$env:FOLDERBOX_VERSION-smoke"
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\FolderBox.iss"

          Compress-Archive `
            -Path "dist\FolderBox\*" `
            -DestinationPath "release\FolderBox-Portable-$version.zip" `
            -Force

          $files = Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          if ($files.Count -lt 2) {
            throw "Expected installer and portable archive were not generated."
          }

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

          Get-ChildItem release -File | Select-Object Name,Length

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolderBox-package-smoke
          path: release/*
          if-no-files-found: error
          retention-days: 7

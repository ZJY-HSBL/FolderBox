name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[build,dev]"

      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c "import folderbox; print(folderbox.__version__)"
          $expectedTag = "v$version"

          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $requestedTag = "${{ github.ref_name }}"
          } else {
            $refName = "${{ github.ref_name }}"
            if (-not $refName.StartsWith("release/")) {
              throw "Unsupported release ref: $refName"
            }
            $requestedTag = $refName.Substring("release/".Length)
          }

          if ($requestedTag -ne $expectedTag) {
            throw "Release ref $requestedTag does not match package version $version."
          }

          "FOLDERBOX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOLDERBOX_RELEASE_TAG=$expectedTag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Quality checks
        run: |
          python -m ruff check folderbox tests
          python -m pytest -q

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --name FolderBox `
            --icon assets/app.ico `
            --add-data "assets;assets" `
            folderbox/__main__.py

      - name: Verify application bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FolderBox\FolderBox.exe")) {
            throw "FolderBox.exe was not generated."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = $env:FOLDERBOX_VERSION
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "packaging\FolderBox.iss"
          Compress-Archive -Path "dist\FolderBox\*" -DestinationPath "release\FolderBox-Portable-$version.zip" -Force
          $files = Get-ChildItem release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          if ($files.Count -lt 2) {
            throw "Expected installer and portable archive were not generated."
          }

          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = "release-notes/$env:FOLDERBOX_VERSION.md"
          $tag = $env:FOLDERBOX_RELEASE_TAG

          if (gh release view $tag 2>$null) {
            throw "Release $tag already exists."
          }

          if (Test-Path $notesFile) {
            gh release create $tag release/* --target "${{ github.sha }}" --title "FolderBox $tag" --notes-file $notesFile
          } else {
            gh release create $tag release/* --target "${{ github.sha }}" --title "FolderBox $tag" --generate-notes
          }
